name: Generate RSS feed

on:
  schedule:
    # Poniedzialek-piatek: rano co 30 min, 05:07-10:07 czasu polskiego
    - cron: '7,37 5-9 * * 1-5'
      timezone: "Europe/Warsaw"
    - cron: '7 10 * * 1-5'
      timezone: "Europe/Warsaw"

    # Codziennie: 15:07 i 19:07 czasu polskiego
    - cron: '7 15 * * *'
      timezone: "Europe/Warsaw"
    - cron: '7 19 * * *'
      timezone: "Europe/Warsaw"

    # Poniedzialek wieczorem: co 30 min, 20:07-23:37
    - cron: '7,37 20-23 * * 1'
      timezone: "Europe/Warsaw"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser==6.0.11

      - name: Generate feed.xml
        run: python feed_generator.py

      - name: Commit and push feed.xml
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feed.xml state.json
          git commit -m "Update feed.xml" || echo "No changes to commit"
          git push
