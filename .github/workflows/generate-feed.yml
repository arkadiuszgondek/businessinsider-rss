name: Generate RSS feed

on:
  schedule:
    # UWAGA: cron w GitHub Actions jest ZAWSZE w UTC i nie uwzględnia DST.
    # Godziny PL poniżej dotyczą czasu letniego (CEST, UTC+2); zimą (CET) przesuną się o -1h.
    # Minuty celowo poza :00/:15/:30/:45, żeby unikać szczytu kolejki GitHuba.

    # Pon–pt, co ~15 min od ~05:07 do ~09:52 CEST
    - cron: '7,22,37,52 3-7 * * 1-5'
    # Pon–pt ~10:08 CEST
    - cron: '8 8 * * 1-5'

    # Codziennie ~14:08 i ~18:08 PL (lato)
    - cron: '8 13 * * *'
    - cron: '8 17 * * *'

    # Poniedziałek wieczór, co ~15 min ~20:07–23:52 CEST
    - cron: '7,22,37,52 18-21 * * 1'
    # Poniedziałek ~00:08 CEST (już wtorek)
    - cron: '8 22 * * 1'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write          # wymagane przez keepalive-workflow

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser==6.0.11

      - name: Generate feed.xml
        run: python feed_generator.py

      - name: Commit and push feed.xml
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feed.xml state.json
          git commit -m "Update feed.xml" || echo "No changes to commit"
          git push

      # Zapobiega wyłączeniu harmonogramu po 60 dniach bez aktywności.
      # Nic nie robi, dopóki ostatni commit nie jest starszy niż ~45 dni.
      - name: Keepalive (anti 60-day disable)
        uses: gautamkrishnar/keepalive-workflow@v2
